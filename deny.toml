# cargo-deny policy for the Rust workspace — run by CI (job `cargo-deny`):
#   cargo deny --locked check advisories bans licenses sources
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Platforms the gateway is built for (Docker amd64/arm64) or developed on:
# crates that only build for other targets (Windows, wasm, UEFI) are not judged.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
# Every vulnerability fails the check. Unmaintained crates only fail when a
# workspace crate depends on them directly: the transitive ones (atty, bincode,
# derivative, paste, rustls-pemfile, libsecp256k1 via solana-sdk) have no
# maintained drop-in and are tracked with the dependency that pulls them in.
unmaintained = "workspace"
yanked = "deny"
# Every entry needs a reason and is removed as soon as the dependency moves.
ignore = [
    # curve25519-dalek 3.2.0 (timing variability in Scalar sub) and
    # ed25519-dalek 1.0.1 (double public key signing oracle) only arrive through
    # solana-sdk 2.x -> solana-keypair -> ed25519-dalek-bip32 0.2. The gateway
    # never signs Solana transactions: the wallet crate derives Solana addresses
    # with ed25519-dalek 2.x and only uses solana-sdk's Pubkey/ATA helpers.
    # Drop when solana-sdk is replaced by the solana-pubkey/spl crates or upgraded.
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 3.x via solana-sdk 2.x, never used to sign (wallet uses ed25519-dalek 2)" },
    { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.x via solana-sdk 2.x (solana-keypair), never used to sign" },
]

[licenses]
# Permissive licenses only. A copyleft one (GPL/LGPL/AGPL/MPL…) needs an
# explicit per-crate exception below, reviewed: the image is distributed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MITNFA",
]
confidence-threshold = 0.8
exceptions = []

# The Breez SDK crates (git dependency github.com/breez/spark-sdk, MIT at the
# repository root) declare no `license` in their manifests. Re-check these when
# bumping the Breez tag.
[[licenses.clarify]]
crate = "breez-sdk-spark"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "breez-sdk-common"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "lnurl-models"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "spark"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "spark-wallet"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "spark-sqlite"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flashnet"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "utils"
expression = "MIT"
license-files = []

# `macros` and `platform-utils` exist in both breez/spark-sdk and
# breez/boltz-client (MIT as well).
[[licenses.clarify]]
crate = "macros"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "platform-utils"
expression = "MIT"
license-files = []

[licenses.private]
# The workspace's own crates (and git crates marked publish = false) are not
# published: no license check.
ignore = true

[bans]
# Duplicate versions are common in the crypto/Solana stacks: reported, not fatal.
multiple-versions = "warn"
# Workspace path dependencies carry no version, which counts as a wildcard
# unless every member declares `publish = false`. Once they do, switch to
# "deny" with allow-wildcard-paths = true.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies (Breez SDK and what it pins).
allow-git = [
    "https://github.com/breez/spark-sdk",
    "https://github.com/breez/boltz-client",
    "https://github.com/lightsparkdev/frost",
]
