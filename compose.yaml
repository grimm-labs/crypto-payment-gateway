# Production-like local stack: every app runs from its Docker image.
#   docker compose up --build
#
# For development with hot reload, run only the infrastructure (compose.dev.yaml)
# and start the apps with Nx on your machine (pnpm dev).
name: stablecoin-payment-gateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: stablecoin-payment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stablecoin_payment
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stablecoin_payment']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stablecoin-payment-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: spg/api:local
    container_name: stablecoin-payment-api
    restart: unless-stopped
    # Secrets and provider keys (WALLET_MNEMONIC, JWT_SECRET, …) come from .env.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stablecoin_payment
      REDIS_URL: redis://redis:6379
      BREEZ_STORAGE_DIR: /app/.breez-data
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Breez SDK (Lightning) wallet storage — must survive restarts.
      - breez_data:/app/.breez-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dashboard
    image: spg/dashboard:local
    container_name: stablecoin-payment-dashboard
    restart: unless-stopped
    environment:
      # nginx proxies /api here (rendered at container start by docker/dashboard/start.sh).
      API_URL: http://api:3000
    ports:
      - '${DASHBOARD_PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  breez_data:
