name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last successful commit on the base branch.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build (Nx affected)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned explicitly (matches package.json's packageManager).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Rust toolchain, protoc (Breez SDK) and the cargo cache.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      # api: cargo clippy / cargo test --workspace / cargo build --release;
      # dashboard: eslint / tsc + vite build. Only what the change affects runs.
      - run: pnpm nx affected -t lint test build --parallel=2
        env:
          NX_DAEMON: 'false'

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the combined image (all targets)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: all
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
