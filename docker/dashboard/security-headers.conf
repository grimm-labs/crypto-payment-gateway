# Security headers sent on every dashboard response (`always`: error pages too).
#
# nginx inherits add_header from the enclosing block ONLY when a block declares
# no add_header of its own, so every location that adds one (Cache-Control)
# includes this file again: never add a header to a location without it.
#
# CSP, checked against the built bundle (apps/dashboard/dist):
# - script-src 'self': one same-origin module script, no inline script and no
#   eval. Zod 4 probes `new Function("")` once and falls back to its non-JIT
#   path when CSP blocks it (one console report, nothing breaks).
# - style-src 'unsafe-inline': sonner, vaul and react-remove-scroll (Radix
#   dialogs) inject <style> elements at runtime, and components/ui/chart.tsx
#   renders one. Inline style attributes set from JS (recharts, Radix
#   positioning) go through CSSOM, which CSP does not restrict.
# - img-src / font-src 'self': QR codes are inline <svg> (qrcode.react
#   QRCodeSVG), icons are inline SVG, the Geist fonts are bundled woff2 files.
# - connect-src 'self': the SPA only calls its own origin (/api, proxied below).
# No upgrade-insecure-requests: it would break the plain-HTTP local stack;
# HSTS covers production (browsers ignore it over plain HTTP).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
